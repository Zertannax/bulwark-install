name: Sync installers

# Mirror Zertannax/bulwark scripts/install.{sh,ps1} into this repo on every
# push to master there. The bulwark repo is the single source of truth;
# this repo is just a delivery channel for getwark.com/install.{sh,ps1}.

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:17 UTC as a safety net for missed webhooks
    - cron: "17 6 * * *"
  push:
    # If a release tag is published, mirror immediately (tags aren't
    # pushed to the default branch, so the schedule is the only other
    # trigger — this guarantees same-day coverage).
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull installers from bulwark (master)
        uses: actions/checkout@v4
        with:
          repository: Zertannax/bulwark
          ref: master
          path: __source__
          token: ${{ secrets.BULWARK_SOURCE_TOKEN }}
          sparse-checkout: scripts/install.sh
          # .ps1 isn't supported by sparse-checkout's `files:` syntax on
          # Linux runners (the filter runs through a POSIX-only code
          # path), so we just do a full checkout and pick what we need.

      - name: Install installers into repo root
        run: |
          cp __source__/scripts/install.sh install.sh
          chmod +x install.sh
          if [ -f __source__/scripts/install.ps1 ]; then
            cp __source__/scripts/install.ps1 install.ps1
          fi
          rm -rf __source__

      - name: Commit if changed
        run: |
          git config user.name "bulwark-install-bot"
          git config user.email "bot@getwark.com"
          git add install.sh install.ps1 2>/dev/null || git add install.sh
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: sync installers from Zertannax/bulwark@master"
          git push
