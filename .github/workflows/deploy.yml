name: Deploy to Cloudflare Pages

# Deploys this repo (which mirrors Zertannax/bulwark@master:scripts/install.sh)
# to the Cloudflare Pages project "bulwark-install" on every push to main.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN — Custom token with Pages:Edit permission

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a4134449cc213972be1fe563886d5d72
          projectName: bulwark-install
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # No build step — these are raw static files (install.sh, README, LICENSE).
          # Cloudflare Pages serves them as-is.
